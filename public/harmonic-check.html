<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>P.M. 与泛音试听 · Stringflow</title>
    <style>
      body {
        font:
          16px/1.7 system-ui,
          sans-serif;
        color: #263342;
        background: #f6f7fb;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 18px;
        margin-top: 0;
      }
      section {
        background: white;
        border: 1px solid #dfe3eb;
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
      }
      audio {
        width: 100%;
        margin-top: 8px;
      }
      a {
        color: #6651bb;
      }
      p {
        margin: 8px 0;
      }
      .note {
        font-size: 14px;
        color: #586779;
      }
      button {
        padding: 9px 16px;
        border: 1px solid #ccc3e4;
        border-radius: 8px;
        background: white;
        color: #56439c;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <a href="./?song=something-just-like-this">← 返回曲谱</a>
    <h1>P.M. 与泛音试听</h1>
    <p>先听起音，再听余音。建议使用耳机比较泛音的立体声空间。</p>
    <section>
      <h2>掌根制音 P.M.</h2>
      <p class="note">
        同一组低音与和弦：上一版 → 新版。保留音高、短促拨弦起音和琴体共鸣。
      </p>
      <label
        >上一版<audio
          controls
          preload="metadata"
          src="audio/pm-previous.mp3"
        ></audio></label
      ><label
        >新版<audio
          controls
          preload="metadata"
          src="audio/pm-current.mp3"
        ></audio
      ></label>
    </section>
    <section>
      <h2>泛音</h2>
      <p class="note">
        每段依次为 C5、D5、G5，再同时弹响三音。对比前 700 毫秒的单音 RMS
        音量已对齐。
      </p>
      <label
        >上一版：拍泛音干声<audio
          controls
          preload="metadata"
          src="audio/harmonic-previous.mp3"
        ></audio></label
      ><label
        >新版：干声<audio
          controls
          preload="metadata"
          src="audio/harmonic-dry.mp3"
        ></audio></label
      ><label
        >新版：空灵空间<audio
          id="after"
          controls
          preload="metadata"
          src="audio/harmonic-space.mp3"
        ></audio></label
      ><button id="chord">只听三弦泛音：空灵</button>
    </section>
    <p class="note">
      曲谱底部「记号 / 音色」可切换泛音空间：干声、自然、空灵。
    </p>
    <p class="note">
      全部音频来自网站自己的合成引擎，没有原演奏录音采样；混响不是原演奏效果器的复刻。播放器本身的音量不受这里的试听对齐影响。
    </p>
    <script>
      const players = [...document.querySelectorAll("audio")];
      players.forEach((player) =>
        player.addEventListener("play", () =>
          players
            .filter((other) => other !== player)
            .forEach((other) => other.pause()),
        ),
      );
      document.querySelector("#chord").onclick = () => {
        const player = document.querySelector("#after");
        player.currentTime = 5.2;
        player.play().catch(() => {});
      };
    </script>
  </body>
</html>
